<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMarkdown Editor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        }
    </style>
</head>

<body>

<div id="elm"></div>

<script src="main.js"></script>

<script>
    var app = Elm.Main.init({
        node: document.getElementById("elm"),
        flags: {
            window: {
                windowWidth: window.innerWidth,
                windowHeight: window.innerHeight
            }
        }
    });

    // Listen for CSS injection from Elm (syntax highlighting)
    app.ports.injectHighlightCSS.subscribe((css) => {
        const oldStyle = document.getElementById('highlight-style');
        if (oldStyle) {
            oldStyle.remove();
        }
        const style = document.createElement('style');
        style.id = 'highlight-style';
        style.textContent = css;
        document.head.appendChild(style);
    });

    // Listen for editor highlight color changes from Elm
    app.ports.setEditorHighlightColor.subscribe((colorStr) => {
        document.documentElement.style.setProperty('--editor-highlight-color', colorStr);
    });
</script>

</body>
</html>
